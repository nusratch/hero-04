<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>


 <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-cyan-700 min-h-screen ">


  <div class="  py-6 px-10 mt-16">
    <h1 class="text-4xl md:text-5xl font-bold text-white">
      Job Application Tracker
    </h1>
  </div>

  <div class="max-w-4xl mx-auto px-4">
    
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">


      <div class="card bg-base-100 shadow-xl text-center p-6">
        <h2 id="totalCount" class="text-3xl font-bold text-blue-600">8</h2>
        <p class="text-gray-600 mt-2">Total</p>
      </div>


      <div class="card bg-base-100 shadow-xl text-center p-6">
        <h2 id="interviewCount" class="text-3xl font-bold text-green-600">0</h2>
        <p class="text-gray-600 mt-2">Interview</p>
      </div>


      <div class="card bg-base-100 shadow-xl text-center p-6">
        <h2 id="rejectedCount" class="text-3xl font-bold text-red-600">0</h2>
        <p class="text-gray-600 mt-2">Rejected</p>
      </div>

    </div>

  </div>

  <script src="script/control.js"></script>

</body>
</html>
